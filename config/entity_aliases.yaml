# Entity alias dictionary for cross-lingual knowledge base retrieval.
#
# When a query contains any form (canonical or alias), the search pipeline
# automatically appends all other forms so both BM25 keyword matching and
# vector retrieval can find documents regardless of the language used.
#
# Format:
#   - forms: [list of equivalent terms — order does not matter]
#
# Guidelines:
#   - List the most commonly used form first (aids readability, not logic).
#   - Include all spelling variants that appear in your documents.
#   - Keep entries focused: one product / company / concept per group.
#   - Abbreviations belong in the same group as their expansions.

groups:
