# Entity alias dictionary for cross-lingual knowledge base retrieval AND
# product-attribution conflict detection.
#
# Two fields per group:
#   - forms:    cross-lingual / cross-spelling aliases for the SAME entity
#               (e.g. "鲁邦通" ↔ "Robustel"). Forms expand into BM25/vector
#               queries so retrieval finds documents regardless of which form
#               the user typed.
#   - products: model numbers / SKUs that belong to this entity (e.g. "EG5120"
#               belongs to Robustel). Products are NOT expanded into queries
#               (that would corrupt retrieval); they only participate in
#               entity-detection and attribution-conflict checks.
#
# When a query says "Brand X's Product Y" but Y is registered under Brand Z,
# the pipeline emits an `<entity_warning>` block to the LLM so it can refuse
# to fabricate specs. See internal/config/config.go EntityAliasGroup doc.
#
# Guidelines:
#   - List the most commonly used form first (it becomes the canonical name).
#   - Include all spelling variants seen in documents under forms.
#   - List a model only once; do NOT cross-list the same model under multiple
#     groups (a product belongs to one brand).
#   - Keep entries focused: one product / company / concept per group.
#   - For groups that are purely conceptual (protocols, technologies), products
#     can stay empty — they only matter for branded products.

groups:
  # ── Companies (Robustel ecosystem) ───────────────────────────────────────
  # Forms include full English + Chinese registered names so the LLM can
  # answer "what's Robustel's Chinese name" / "鲁邦通的全称是什么" without
  # fabricating transliterations.
  - forms: ["鲁邦通", "Robustel", "广州鲁邦通物联网科技股份有限公司", "Guangzhou Robustel Co. Ltd"]
    products:
      # 5G/4G industrial edge gateways
      - "EG5120"
      # LTE/LoRaWAN routers (R-series)
      - "R1511LG"
      - "R1520LG"
      - "R3000 LG"
      # LoRaWAN industrial gateways (LG-series)
      - "LG5100"
      # Cloud management platform
      - "RCMS"

  # Milesight is the Chinese vendor 厦门星纵物联科技有限公司 — fully-spelled
  # forms here prevent the LLM from fabricating phonetic-sounding 中文 names
  # (镁伽 / 锐谷 / 迈世 etc) when asked for the brand's Chinese name.
  - forms: ["Milesight", "星纵物联", "星纵", "厦门星纵物联科技有限公司", "Xiamen Milesight IoT Co. Ltd"]
    products:
      # LoRaWAN gateways & building-automation IoT devices
      - "EG71"
      - "UG65"
      - "UG67"

  # ── Major vendors (common in customer / partner documents) ───────────────
  # Add products: [] for these as they appear in real documents. Until then,
  # form-based detection still works for cross-source contamination guards.
  - forms: ["西门子", "Siemens"]
  - forms: ["施耐德", "施耐德电气", "Schneider Electric", "Schneider"]
  - forms: ["霍尼韦尔", "Honeywell"]
  - forms: ["江森自控", "约翰逊控制", "Johnson Controls", "JCI"]
  - forms: ["博世", "Bosch"]
  - forms: ["ABB"]
  - forms: ["华为", "Huawei"]
  - forms: ["中兴", "ZTE"]

  # ── Technologies / protocols ─────────────────────────────────────────────
  # These are NOT brands and MUST NOT serve as anchors for entity-mismatch
  # detection: a query mentioning "LoRa" is not claiming any vendor, so a
  # Robustel datasheet that says "LoRa" should not be flagged as off-topic.
  # kind: technology makes DetectFormGroups skip these groups when looking
  # for a brand anchor, while still using their Forms for cross-lingual
  # query expansion via Expand().
  - kind: technology
    forms: ["LoRaWAN", "LoRa WAN", "LoRa"]
  - kind: technology
    forms: ["物联网", "IoT", "Internet of Things"]
  - kind: technology
    forms: ["工业互联网", "工业物联网", "IIoT", "Industrial IoT"]
  - kind: technology
    forms: ["边缘计算", "Edge Computing", "边缘网关", "Edge Gateway"]
  - kind: technology
    forms: ["楼宇自动化", "楼控", "Building Automation", "BAS", "BMS"]
  - kind: technology
    forms: ["能源管理", "能耗管理", "Energy Management", "EMS"]
  - kind: technology
    forms: ["预测性维护", "预测维护", "Predictive Maintenance", "PdM"]
